{% extends 'base.html' %}
{% block content %}
<div class="content">
  <form action="" method="post" class="buttons card-form">
    <h3>Enter The Chat Room</h3>
    <div class="input-group">
      <label>Name:</label>
      <input type="text" placeholder="Pick a name!" name="name" value="{{name}}" required>
    </div>
    <div class="join input-group">
      <input type="text" placeholder="Room Code" name="code" value="{{code}}">
      <button type="submit" name="join" class="btn btn-join">Join a Room</button>
    </div>
    <button type="submit" name="create" class="btn create-btn">Create a Room</button>

    {% if error %}
    <div class="error-box">
      <ul><li>{{ error }}</li></ul>
    </div>
    {% endif %}
  </form>
</div>
{% endblock %}
